# Auto-sync this fork's `master` with upstream (dishwasher-detergent/mault).
#
# Design notes:
# - Scheduled workflows only run when this file exists on the repo's DEFAULT
#   branch, so it is committed to `master` itself. That makes `master` =
#   upstream + this one file, kept linear via `git rebase` on every run.
# - `git rebase upstream/master` replays our workflow commit on top of the
#   latest upstream commit, so the tree is always upstream + workflow file.
# - `--force-with-lease` pushes the result but refuses to clobber the fork if
#   someone else pushed to `master` while the job was running.
# - Nothing here touches the `custom` branch. Pull upstream into `custom`
#   locally with: git checkout custom && git merge master
#
# To run manually (or after enabling Actions): Actions -> "Sync fork with
# upstream" -> Run workflow.

name: Sync fork with upstream

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Rebase onto upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dishwasher-detergent/mault.git
          git fetch upstream
          git rebase upstream/master

      - name: Push to fork
        run: git push --force-with-lease origin master
