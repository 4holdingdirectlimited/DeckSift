# CI checks for the fork: typecheck the web app and compile the firmware on
# every push to master/custom and on pull requests.
#
# Note: GitHub disables Actions on forks by default — enable them at
# Settings -> Actions -> General -> "Allow all actions and reusable workflows".

name: Checks

on:
  push:
    branches: [master, custom]
  pull_request:

jobs:
  web-typecheck:
    name: Web app typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  firmware-compile:
    name: Firmware compile (Uno R4 Minima)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arduino/arduino-cli-action no longer exists on GitHub, which made this
      # job fail on every push regardless of the firmware. compile-sketches is
      # the current official Arduino action and handles core/library setup.
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:renesas_uno:minima
          sketch-paths: |
            - arduino/main
          platforms: |
            - name: arduino:renesas_uno
          libraries: |
            - name: ArduinoJson
              version: 7.4.3
            - name: Adafruit PWM Servo Driver Library
              version: 3.0.3
          enable-deltas-report: false
          enable-warnings-report: false
