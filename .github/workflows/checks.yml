# CI checks for the fork: typecheck + lint + unit tests for the TS workspace
# and compile the firmware on every push to custom and on pull requests.
#
# Note: GitHub disables Actions on forks by default — enable them at
# Settings -> Actions -> General -> "Allow all actions and reusable workflows".

name: Checks

on:
  push:
    branches: [custom]
  pull_request:

jobs:
  web-typecheck:
    name: Web app typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  tests:
    name: Unit tests (shared + server)
    runs-on: ubuntu-latest
    # The route integration suite (packages/server/src/routes/app.integration.test.ts)
    # runs the real Hono app against a scratch Postgres. pgvector is required
    # because cards.embedding is vector(768) (local-bootstrap.sql creates the
    # extension for local installs; the container image ships it).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decksift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/decksift_test

  firmware-compile:
    name: Firmware compile (Uno R4 + ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arduino/arduino-cli-action no longer exists on GitHub, which made this
      # job fail on every push regardless of the firmware. compile-sketches is
      # the current official Arduino action and handles core/library setup.
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: |
            arduino:renesas_uno:minima
            esp32:esp32:esp32s3
          sketch-paths: |
            - arduino/main
          platforms: |
            - name: arduino:renesas_uno
            - name: esp32:esp32
          libraries: |
            - name: ArduinoJson
              version: 7.4.3
            - name: Adafruit PWM Servo Driver Library
              version: 3.0.3
            - name: WebSockets
              version: 2.7.2
          enable-deltas-report: false
          enable-warnings-report: false
